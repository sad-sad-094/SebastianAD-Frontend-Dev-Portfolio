<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex">
  <title>og-home — social preview template</title>
  <!-- Template for assets/og-home.jpg (1200×630). Re-render with og/render.sh after editing. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>
  <div class="card">

    <h1 class="title">

      <em>Frontend Developer.</em>

    <div class="spec">
      <div><b>Stack</b><span>React · Vue · TypeScript</span></div>
      <div><b>Experiencia</b><span>3+ años · SaaS y producto</span></div>
      <div><b>Idiomas</b><span>Español · Inglés</span></div>
    </div>
  </div>

</html>
